name: Deploy Google Apps Script

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @google/clasp
      - name: Create clasprc.json
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
      - name: Push to GAS
        run: clasp push -f
      - name: Deploy to GAS
        run: clasp deploy -i "AKfycbzCyYJ0zV7_wQTxJLJlYUf5_HGpHidLGJ-VsL86vRU76L5YREra1cY6fdZBiniLU0iYOA" -d "Update code"
        
