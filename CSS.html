<style>
  
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
  :root{ --page-bg:#f8fafc; --muted:#94a3b8; --accent:#f59e0b }
  body{ font-family:'Sarabun',sans-serif; background-color:var(--page-bg); font-size:14px; }

  /* ตารางประวัติ */
 .history-table { border-collapse: separate; border-spacing: 0; width: 100%; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
  .history-table thead th { background: #f8fafc; color: #475569; padding: 12px; font-size: 0.75rem; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; }
  .history-table tbody tr { transition: all 0.2s; border-bottom: 1px solid #f1f5f9; }
  .history-table tbody tr:hover { background-color: #f1f5f9; }
  .history-table td { padding: 12px; vertical-align: middle; }
  
  /* Status Badges */
  .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 0.75rem; }
  
  /* Responsive Mobile View */
  @media (max-width: 768px) {
    .history-table thead { display: none; }
    .history-table, .history-table tbody, .history-table tr, .history-table td { display: block; width: 100%; }
    .history-table tr { background: #fff; margin-bottom: 15px; border-radius: 12px; border: 1px solid #e2e8f0; padding: 10px; }
    .history-table td { border: none; padding: 6px 4px; display: flex; justify-content: space-between; align-items: center; }
    .history-table td::before { content: attr(data-label); font-weight: 700; color: #64748b; font-size: 0.7rem; text-transform: uppercase; }
  }
</style>
