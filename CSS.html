<style>
  /* Clean stylesheet for app layout. Rules:
     - Table cells are single-line (no-wrap) by default to prevent row height changes.
     - The 3rd column (product name) is allowed to wrap.
     - Responsive adjustments: on small screens allow wrapping for readability. */
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');

  :root{ --page-bg:#f8fafc; --muted:#94a3b8; --heading:#0f172a; --accent:#f59e0b }
  html,body{height:100%}
  body{
    font-family:'Sarabun',sans-serif;
    background-color:var(--page-bg)!important;
    font-size:14px;color:var(--heading);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }

  /* Sidebar compact */
  .sidebar-btn, .user-sidebar-btn{ color:var(--muted); background:transparent; border-left:4px solid transparent; padding:.6rem .9rem; font-size:.92rem }
  .sidebar-btn:hover, .user-sidebar-btn:hover{ background:rgba(255,255,255,0.04); color:#fff }
  .sidebar-btn.active, .user-sidebar-btn.active{ background:var(--accent)!important; color:var(--heading)!important; border-left-color:#fbbf24!important }

  input,select,textarea{ outline:none; border:1px solid #cbd5e1!important; font-size:.95rem; padding:.55rem .6rem }
  input:focus,select:focus,textarea:focus{ border-color:var(--heading)!important; box-shadow:0 0 0 3px rgba(15,23,42,.06)!important }

  th{ font-size:.9rem!important; letter-spacing:.02em; color:#475569!important; font-weight:700!important; background-color:var(--page-bg)!important; padding:10px 12px!important; text-align:center }
  td{ vertical-align:middle!important; font-size:.95rem; padding:10px 12px!important }

  /* Card / modal sizing */
  #user-items-grid-container > div, .bg-white.rounded-xl.shadow-sm.border{ padding:1rem!important }
  .img-thumbnail{ max-height:160px; object-fit:cover }
  .fixed.inset-0 .rounded-2xl, .fixed.inset-0 .rounded-xl{ max-width:720px }

  .text-xxs{ font-size:.72rem!important } .text-xs{ font-size:.82rem!important }

  /* Header control sizing: keep logout/profile comfortable touch target */
  header .flex-shrink-0 button, header .flex-shrink-0 .flex {
    padding: .5rem .6rem;
  }

  .animate-fadeIn{ animation:slideUpFade .22s ease-out forwards }
  @keyframes slideUpFade{ from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

  /* Default: table cells should not wrap (single-line). Use ellipsis to keep layout tidy. */
  table.w-full th, table.w-full td{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px }

  /* Status badges/pills should remain on one line */
  .status-pill { white-space: nowrap; display: inline-block; }

  /* Exception: product name column (3rd) may wrap if it exceeds width */
  table.w-full th:nth-child(3), table.w-full td:nth-child(3){ white-space:normal; overflow-wrap:anywhere; word-break:break-word; max-width:420px }

  /* Responsive: allow wrapping on small screens for readability */
  @media (max-width:640px){
    th,td{ font-size:.78rem!important; padding:8px 6px!important }
    .img-thumbnail{ max-height:110px }
    #user-items-grid-container{ grid-template-columns:repeat(1,minmax(0,1fr)) }
    .fixed.inset-0 .rounded-2xl, .fixed.inset-0 .rounded-xl{ max-width:94% }
    table.w-full th, table.w-full td{ white-space:normal; max-width:none }
  }

  .filter-btn{ color:#475569 }
  .filter-btn.bg-slate-900{ background-color:#0f172a!important; color:#fbbf24!important }

  /* History table styling */
  .history-table thead th { background: linear-gradient(90deg,#f8fafc,#f1f5f9); color:#334155; border-bottom:1px solid #e6eef8; }
  .history-table tbody tr { transition: background .12s ease, transform .08s ease; }
  .history-table tbody tr:hover { background:#fbfbfd; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(15,23,42,0.04); }
  .history-table td { padding: .85rem .75rem; vertical-align: middle; }
  .history-table .col-id { width:110px; font-family: monospace; color:#0f172a; }
  .history-table .col-name { text-align:left; max-width: 420px; overflow-wrap:anywhere; }
  .history-table .col-qty { width:110px; text-align:center; font-weight:700; }
  .history-table .col-user { width:220px; }
  .history-table .status-badge { display:inline-flex; align-items:center; gap:.5rem; padding:.35rem .7rem; border-radius:999px; font-weight:700; font-size:.75rem; }
  .status-badge.pending { background:#fff7ed; color:#a16207; border:1px solid #fde3b7; }
  .status-badge.borrowing { background:#fff1f2; color:#9f1239; border:1px solid #f7c6cf; }
  .status-badge.returned { background:#ecfdf5; color:#065f46; border:1px solid #c6f6d9; }
  .status-badge.rejected { background:#fff1f2; color:#7f1d1d; border:1px solid #fcd3d6; }

</style>
/* Mobile-first forced view for USER role */
<style>
  body.force-mobile-view {
    overflow-x: hidden;
  }
  /* hide large sidebar and show a compact mobile header */
  body.force-mobile-view #sidebar-menu { display: none !important; }
  body.force-mobile-view #sidebar-overlay { display: none !important; }
  body.force-mobile-view header { position: sticky; top: 0; z-index: 60; }

  /* Force item grid to single column and increase spacing for readability */
  body.force-mobile-view #user-items-grid-container { grid-template-columns: repeat(1, minmax(0, 1fr)) !important; gap: 12px !important; }

  /* For tables in management area: present each row as a stacked card for mobile users */
  body.force-mobile-view table.w-full { display: block !important; }
  body.force-mobile-view table.w-full thead, body.force-mobile-view table.w-full tbody, body.force-mobile-view table.w-full tr { display:block !important; width:100% !important; }
  body.force-mobile-view table.w-full tr { margin-bottom: 12px; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(15,23,42,0.06); }
  /* Use block layout for cells so content stacks vertically similar to preview cards */
  body.force-mobile-view table.w-full td, body.force-mobile-view table.w-full th { display: block !important; padding: 10px !important; white-space: normal !important; border-bottom: 0 !important; }
  body.force-mobile-view table.w-full td:first-child, body.force-mobile-view table.w-full th:first-child { padding-top: 12px !important; }
  body.force-mobile-view table.w-full td .label { font-weight:700; color:#475569; margin-right:8px; }
  /* Ensure label and value stack clearly in mobile table cells */
  body.force-mobile-view table.w-full td .label { display:block; margin-bottom:6px; }
  body.force-mobile-view table.w-full td .value { display:block; color:#0f172a; }

  /* hide admin-only columns/actions to simplify view */
  body.force-mobile-view td .btn-group { display:flex; gap:8px; }

  @media (min-width: 640px) {
    body.force-mobile-view table.w-full td, body.force-mobile-view table.w-full th { white-space: normal !important; }
  }
</style>
