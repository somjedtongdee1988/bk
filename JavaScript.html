<script>
  let tempItemBase64Str = ""; 
  let autoRefreshInterval = null;
  const $id = (id) => document.getElementById(id);

  document.addEventListener("DOMContentLoaded", function() {
    evaluateDisplayState();
    const bDateEl = document.getElementById("cartBorrowDate");
    if(bDateEl) {
      const today = new Date().toISOString().split('T')[0];
      bDateEl.value = today;
    }
  });

  function showToast(message, type = "success") {
    const container = document.getElementById("toast-container");
    if (!container) return;
    const toast = document.createElement("div");
    toast.className = `flex items-center p-3.5 rounded-xl shadow-xl text-xs font-bold tracking-wide border transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto bg-white animate-fadeIn`;
    if (type === "success") {
      toast.classList.add("border-emerald-200", "text-emerald-800", "bg-emerald-50/90");
      toast.innerHTML = `<span class="text-base mr-2">✅</span> <div>${message}</div>`;
    } else {
      toast.classList.add("border-rose-200", "text-rose-900", "bg-rose-50/90");
      toast.innerHTML = `<span class="text-base mr-2"> ❌ </span> <div>${message}</div>`;
    }
    container.appendChild(toast);
    setTimeout(() => { toast.classList.remove("translate-y-2", "opacity-0"); }, 10);
    setTimeout(() => {
      toast.classList.add("translate-y-[-10px]", "opacity-0");
      setTimeout(() => { toast.remove(); }, 300);
    }, 4000);
  }

  function toggleAuthBox(mode) {
    const regMsg = document.getElementById("reg-error-msg");
    const loginMsg = document.getElementById("login-error-msg");
    const loginBox = document.getElementById("login-box");
    const regBox = document.getElementById("register-box");
    if(regMsg) regMsg.classList.add("hidden");
    if(loginMsg) loginMsg.classList.add("hidden");
    if(mode === 'REG') {
      if(loginBox) loginBox.classList.add("hidden");
      if(regBox) regBox.classList.remove("hidden");
    } else {
      if(loginBox) loginBox.classList.remove("hidden");
      if(regBox) regBox.classList.add("hidden");
    }
  }

  function fileToBase64(fileInput, callback) {
    if (fileInput && fileInput.files && fileInput.files[0]) {
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const MAX_SIDE_LEN = 400; 
          if (width > height) {
            if (width > MAX_SIDE_LEN) { height *= MAX_SIDE_LEN / width; width = MAX_SIDE_LEN; }
          } else {
            if (height > MAX_SIDE_LEN) { width *= MAX_SIDE_LEN / height; height = MAX_SIDE_LEN; }
          }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    } else { callback(""); }
  }

  function previewItemFileImage(input) {
    if (input.files && input.files[0]) {
      fileToBase64(input, function(base64Data) {
        tempItemBase64Str = base64Data;
        const imgPrev = document.getElementById("modalItemImagePreview");
        if(imgPrev) {
          imgPrev.src = base64Data;
          imgPrev.classList.remove("hidden");
        }
      });
    }
  }

  function executeRegister(e) {
    e.preventDefault();
    const name = document.getElementById("regFullName").value;
    const email = document.getElementById("regEmail").value;
    const user = document.getElementById("regUsername").value;
    const pass = document.getElementById("regPassword").value;
    const confirmPass = document.getElementById("regConfirmPassword").value;
    const fileEl = document.getElementById("regProfilePic");
    const errEl = document.getElementById("reg-error-msg");
    const btn = document.getElementById("regBtn");
    if(errEl) errEl.classList.add("hidden");
    if (pass.length < 6) { 
      if(errEl) { errEl.innerText = "❌ รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร"; errEl.classList.remove("hidden"); }
      return; 
    }
    if (pass !== confirmPass) { 
      if(errEl) { errEl.innerText = "❌ รหัสผ่านไม่ตรงกัน"; errEl.classList.remove("hidden"); }
      return; 
    }
    if(btn) { btn.disabled = true; btn.innerText = "กำลังสมัครสมาชิก..."; }
    fileToBase64(fileEl, function(base64Data) {
      google.script.run
        .withSuccessHandler(function(res) {
          if(btn) { btn.disabled = false; btn.innerText = "✅ ยืนยันสมัครสมาชิก"; }
          if(res.success) { 
            showToast(res.message, "success");
            toggleAuthBox('LOG'); 
          } else { 
            if(errEl) { errEl.innerText = res.message; errEl.classList.remove("hidden"); }
            showToast(res.message, "error");
          }
        })
        .registerNewUser(user, pass, name, email, base64Data);
    });
  }

  function executeLogin(e) {
    e.preventDefault();
    const userEl = document.getElementById("loginUsername");
    const passEl = document.getElementById("loginPassword");
    const errEl = document.getElementById("login-error-msg");
    const btnEl = document.getElementById("loginBtn");
    if(errEl) errEl.classList.add("hidden"); 
    if(btnEl) { btnEl.disabled = true; btnEl.innerText = "กำลังตรวจสอบ..."; }
    google.script.run
      .withSuccessHandler(function(res) {
      if(btnEl) {
        btnEl.disabled = false;
        btnEl.innerText = "🔑 เข้าสู่ระบบ";
      }
      if (res.success) {
        CURRENT_USER_EMAIL = res.username;
        CURRENT_USER_ROLE = res.role;
        IS_PROFILE_COMPLETE = res.isProfileComplete;
        MY_PROFILE_CACHE = res.profile;
        showToast(res.message, "success");
        evaluateDisplayState();
        startAutoRefresh();
      } else {
        if(errEl) {
          errEl.innerText = res.message;
          errEl.classList.remove("hidden");
        }
        showToast(res.message, "error");
      }
    }).processFormLogin(userEl.value, passEl.value);
  }

 function startAutoRefresh() {
   console.log("Auto Refresh System Started");
   if (autoRefreshInterval) {
     clearInterval(autoRefreshInterval);
   }
   autoRefreshInterval = setInterval(() => {
     console.log("Auto-refreshing dashboard data...");
     try {
       if (typeof loadDashboard === "function") {
         loadDashboard();
       }
       if (
         CURRENT_USER_ROLE === "SUPER_ADMIN" &&
         typeof loadExecutiveReport === "function"
       ) {
         loadExecutiveReport();
       }
       if (typeof loadUserHistoryData === "function") {
         loadUserHistoryData();
       }
     } catch(err) {
       console.error("Auto Refresh Error :", err);
     }
   }, 180000);
 }

  function executeLogout() { 
    const modal = document.getElementById("logout-confirm-modal");
    if(modal) modal.classList.remove("hidden"); 
  }
  
  function confirmLogoutAction() {
   CURRENT_USER_EMAIL = "";
   CURRENT_USER_ROLE = "USER";
   IS_PROFILE_COMPLETE = true;
   MY_PROFILE_CACHE = null;
   MY_ASSET_CART = [];
   updateCartFloatingBadge();
   closeModal('logout-confirm-modal');
   closeModal('cart-modal');
   switchTab('borrow-tab');
   evaluateDisplayState();
   showToast("ออกจากระบบเรียบร้อยแล้ว", "success");
 }

  function evaluateDisplayState() {
    const authScreen = document.getElementById("auth-screen");
    const mainApp = document.getElementById("main-application");
    const adminMenu = document.getElementById("admin-nav-menu");
    const userMenu = document.getElementById("user-nav-menu");
    const barrierBanner = document.getElementById("profile-barrier-banner");
    const borrowReturnFieldset = document.getElementById("borrow-return-fieldset");
    const personalHistoryBox = document.getElementById("personal-history-box");
    const floatingCartBtn = document.getElementById("floating-cart-btn");
    const reportTab = document.getElementById("tab-content-report-tab");
    const borrowTab = document.getElementById("tab-content-borrow-tab");
    const userItemsTab = document.getElementById("tab-content-user-items-tab");
    const sectionDashboard = document.getElementById("section-dashboard");

    if (CURRENT_USER_EMAIL !== "") {
      if(authScreen) authScreen.classList.add("hidden"); 
      if(mainApp) mainApp.classList.remove("hidden");
      const emailDisplay = document.getElementById("user-display-email");
      const roleBadge = document.getElementById("role-badge");
      if(emailDisplay) emailDisplay.innerText = CURRENT_USER_EMAIL;
      if(roleBadge) roleBadge.innerText = CURRENT_USER_ROLE;
      loadDashboard();
      const avatarEl = document.getElementById("nav-avatar");
      const mobileAvatarEl = document.getElementById("mobile-nav-avatar");
      const roleBadgeMobile = document.getElementById("role-badge-mobile");
      if(roleBadgeMobile) roleBadgeMobile.innerText = CURRENT_USER_ROLE;
      if(MY_PROFILE_CACHE && MY_PROFILE_CACHE.profilePic && MY_PROFILE_CACHE.profilePic !== "") {
        if(avatarEl) { avatarEl.src = MY_PROFILE_CACHE.profilePic; avatarEl.classList.remove("hidden"); }
        if(mobileAvatarEl) { mobileAvatarEl.src = MY_PROFILE_CACHE.profilePic; mobileAvatarEl.classList.remove("hidden"); }
      } else {
        if(avatarEl) avatarEl.classList.add("hidden");
        if(mobileAvatarEl) mobileAvatarEl.classList.add("hidden");
      }
      if (!IS_PROFILE_COMPLETE) {
        if(barrierBanner) barrierBanner.classList.remove("hidden");
        if(borrowReturnFieldset) borrowReturnFieldset.disabled = true;
        if(floatingCartBtn) floatingCartBtn.classList.add("hidden");
        openMyProfileModal(); 
        return;
      } else {
        if(barrierBanner) barrierBanner.classList.add("hidden");
        if(borrowReturnFieldset) borrowReturnFieldset.disabled = false;
      }
      if (CURRENT_USER_ROLE === "SUPER_ADMIN") {
       if(reportTab) reportTab.classList.remove("hidden");
       if(borrowTab) borrowTab.classList.add("hidden");
       if(userItemsTab) userItemsTab.classList.add("hidden");
       if(adminMenu) adminMenu.classList.remove("hidden");
       document.querySelectorAll("#admin-nav-menu .sidebar-btn")
       .forEach(btn => btn.classList.add("hidden"));
       document.getElementById("nav-report-btn")
       ?.classList.remove("hidden");
       CURRENT_EXECUTIVE_FILTER = "MONTH";
       changeExecutiveFilter("MONTH");
      } else if (CURRENT_USER_ROLE === "ADMIN") {
        if(reportTab) reportTab.classList.add("hidden");
        
        switchTab('approval-tab'); 
        
        if(borrowReturnFieldset) borrowReturnFieldset.classList.add("hidden"); 
        if(personalHistoryBox) personalHistoryBox.classList.remove("hidden");
        if(sectionDashboard) sectionDashboard.classList.remove("hidden");
        if(adminMenu) adminMenu.classList.remove("hidden"); 
        if(userMenu) userMenu.classList.add("hidden");
        if(floatingCartBtn) floatingCartBtn.classList.remove("hidden");
        CURRENT_EXECUTIVE_FILTER = "MONTH";
        changeExecutiveFilter("MONTH");
      } else {
        if(reportTab) reportTab.classList.add("hidden");
        if(userItemsTab) userItemsTab.classList.add("hidden");
        if(borrowTab) borrowTab.classList.remove("hidden");
        if(borrowReturnFieldset) borrowReturnFieldset.classList.add("hidden");
        if(personalHistoryBox) personalHistoryBox.classList.remove("hidden");
        if(sectionDashboard) sectionDashboard.classList.add("hidden"); 
        if(adminMenu) adminMenu.classList.add("hidden"); 
        if(userMenu) userMenu.classList.remove("hidden");
        if(floatingCartBtn) floatingCartBtn.classList.remove("hidden");
        loadUserHistoryData();
      }
    } else { 
      if(authScreen) authScreen.classList.remove("hidden"); 
      if(mainApp) mainApp.classList.add("hidden"); 
      if(floatingCartBtn) floatingCartBtn.classList.add("hidden"); 
    }
  }

  function changeExecutiveFilter(type) { CURRENT_EXECUTIVE_FILTER = type; loadExecutiveReport(); }

  function loadExecutiveReport() {
    document.querySelectorAll(".filter-btn").forEach(btn => { btn.classList.remove("bg-slate-900", "text-amber-400"); btn.classList.add("text-slate-600"); });
    const activeBtn = document.getElementById("btn-filter-" + CURRENT_EXECUTIVE_FILTER);
    if(activeBtn) activeBtn.classList.add("bg-slate-900", "text-amber-400");
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) return;
        document.getElementById("kpi-total-items").innerText = res.kpi.totalItems;
        document.getElementById("kpi-avail-items").innerText = res.kpi.availableItems;
        document.getElementById("kpi-borrow-items").innerText = res.kpi.borrowedItems;
        document.getElementById("kpi-range-borrows").innerText = res.kpi.rangeBorrows;
        document.getElementById("kpi-range-pending").innerText = res.kpi.rangePending;
        document.getElementById("kpi-range-returned").innerText = res.kpi.rangeReturned;
        if (locationChartInstance) locationChartInstance.destroy();
        const pieCanvas = document.getElementById('locationPieChart');
 if (pieCanvas) {
  const ctxPie = pieCanvas.getContext('2d');
  locationChartInstance = new Chart(ctxPie, {
    type: 'pie',
    data: {
      labels: res.charts.locationLabels.length > 0
        ? res.charts.locationLabels
        : ["ไม่มีข้อมูล"],
      datasets: [{
        data: res.charts.locationValues.length > 0
          ? res.charts.locationValues
          : [0],
        backgroundColor: [
          '#0f172a',
          '#d97706',
          '#64748b',
          '#475569',
          '#cbd5e1'
        ]
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
 }
        if (itemsChartInstance) itemsChartInstance.destroy();
        const ctxBar = document.getElementById('itemsBarChart').getContext('2d');
        if(ctxBar) {
          itemsChartInstance = new Chart(ctxBar, {
            type: 'bar',
            data: {
              labels: res.charts.itemLabels.length > 0 ? res.charts.itemLabels : ["ไม่มีข้อมูล"],
              datasets: [{ label: 'ความถี่การยืม (ครั้ง)', data: res.charts.itemValues.length > 0 ? res.charts.itemValues : [0], backgroundColor: '#0f172a', borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
          });
        }
      }).getExecutiveReportData(CURRENT_EXECUTIVE_FILTER);
  }

function loadUserHistoryData() {
  const activeEmail = CURRENT_USER_EMAIL;
  const activeRole = CURRENT_USER_ROLE;
  if (!activeEmail) return;
  const tbody = document.getElementById("user-history-tbody");
  if(!tbody) return;

  // เรียกแค่ 5 รายการแรก (page=1, pageSize=5) -> fast mode (full = false by default)
  google.script.run.withSuccessHandler(function(res) {
    if (!res.success || !res.history || res.history.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400 bg-gray-50/50">📝 ไม่พบประวัติบันทึกธุรกรรมการยืมพัสดุในระบบขณะนี้</td></tr>`;
      return;
    }

    // (render rows ตามที่คุณมี)
    tbody.innerHTML = "";
    let approvalCountForBadge = 0;
    res.history.forEach(function(row) {
      // ...สร้าง rowHtml เหมือนเดิม...
      // (ย่อในตัวอย่างนี้ — ให้ใช้โค้ด rendering ที่คุณมี)
      // เพิ่มการคำนวณ approvalCountForBadge ตามสถานะ
    });

    // ถ้าผลลัพธ์บอกว่ามีเพิ่มเติม ให้แสดงปุ่มดูเพิ่มเติม (ไม่ดึงทั้งหมดอัตโนมัติ)
    if (res.hasMore) {
      const moreRow = document.createElement('tr');
      moreRow.innerHTML = `<td colspan="8" class="p-4 text-center bg-white">
        <button id="load-more-history-btn" class="px-4 py-2 bg-slate-900 text-amber-400 rounded-lg font-bold">🔎 ดูเพิ่มเติมทั้งหมด</button>
      </td>`;
      tbody.appendChild(moreRow);
      document.getElementById('load-more-history-btn').addEventListener('click', function() {
        // เรียกให้ full = true เพื่อดึงทั้งหมด (จะใช้เวลามากกว่า)
        google.script.run.withSuccessHandler(function(resAll) {
          if (!resAll.success || !resAll.history) { showToast("ไม่สามารถโหลดข้อมูลเพิ่มเติมได้", "error"); return; }
          // แทนที่ตารางด้วยทั้งหมด (reuse rendering logic)
          // ...render resAll.history...
        }).getUserLoanHistory(activeEmail, activeRole, 1, res.pageSize * 1000000, true);
      });
    }
  }).getUserLoanHistory(activeEmail, activeRole, 1, 5);
}

function loadMoreUserHistory(total) {
  const activeEmail = CURRENT_USER_EMAIL;
  const activeRole = CURRENT_USER_ROLE;
  if (!activeEmail) return;
  const tbody = document.getElementById("user-history-tbody");
  if(!tbody) return;

  // ดึงทั้งหมด (page=1, pageSize=total)
  google.script.run.withSuccessHandler(function(res) {
    if (!res.success || !res.history || res.history.length === 0) {
      showToast("ไม่พบข้อมูลเพิ่มเติม", "error");
      return;
    }
    // แทนที่ตารางด้วยผลลัพธ์ทั้งหมด (reuse rendering from loadUserHistoryData)
    const theadRow = tbody.closest('table').querySelector('thead tr');
    if (theadRow) {
        theadRow.innerHTML = `
          <th class="p-3.5 text-center">รหัสพัสดุ</th>
          <th class="p-3.5">ชื่อครุภัณฑ์อุปกรณ์</th>
          <th class="p-3.5 text-center">จำนวนยืม</th>
          <th class="p-3.5">ผู้ทำรายการยืม</th>
          <th class="p-3.5">วันที่ยืม</th>
          <th class="p-3.5">กำหนดส่งคืน</th>
          <th class="p-3.5">วันที่คืนจริง</th>
          <th class="p-3.5 text-center">สถานะ</th>`;
    }
    tbody.innerHTML = "";
    const adminApprovalTbody = document.getElementById("admin-approval-tbody");
    if(adminApprovalTbody && (activeRole === "ADMIN" || activeRole === "SUPER_ADMIN")) {
       adminApprovalTbody.innerHTML = "";
    }
    let approvalCountForBadge = 0;
    res.history.forEach(function(row) {
      // (ซ้ำการสร้าง row แบบเดียวกับข้างบน)
      let badge = "";
      if (row.status === "รออนุมัติ") {
        approvalCountForBadge++;
        badge = `<span class="inline-flex items-center gap-1.5 bg-amber-50 text-amber-800 text-xs font-bold px-3 py-1 rounded-full border border-amber-200">
                   <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> ⏳ รออนุมัติจากเจ้าหน้าที่
                 </span>`;
      } else if (row.status === "กำลังยืม") {
        badge = `<span class="inline-flex items-center gap-1.5 bg-rose-50 text-rose-700 text-xs font-bold px-3 py-1 rounded-full border border-rose-100">
                   <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span> ค้างคืนอุปกรณ์
                 </span>`;
      } else if (row.status === "ไม่อนุมัติ") {
        badge = `<span class="inline-flex items-center gap-1.5 bg-red-50 text-red-700 text-xs font-bold px-3 py-1 rounded-full border border-red-200">
                   <span class="w-2 h-2 rounded-full bg-red-500"></span> ❌ ปฏิเสธคำขอยืม
                 </span>`;
      } else {
        badge = `<span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full border border-emerald-100">
                   <span class="w-2 h-2 rounded-full bg-emerald-500"></span> ส่งคืนคลังแล้ว
                 </span>`;
      }

      let returnDateDisplay = (row.status === "กำลังยืม" || row.status === "รออนุมัติ" || row.status === "ไม่อนุมัติ") ? "-" : (row.returnDate || "-");

      let rowHtml = `<tr onclick="openTxDetailsModal(${JSON.stringify(row).replace(/"/g, '&quot;')})" class="hover:bg-slate-50 transition border-b border-slate-100 bg-white cursor-pointer">
        <td class="p-3.5 text-center font-mono font-bold text-slate-900">${row.itemId}</td>
        <td class="p-3.5 font-medium text-slate-700">${row.itemName}</td>
        <td class="p-3.5 text-center font-bold text-slate-800">${row.qty} ชิ้น</td>
        <td class="p-3.5 text-slate-600">
          <div class="text-xs">${row.borrowerName}</div>
          <div class="text-xxs text-slate-400 font-mono">${row.borrowerEmail}</div>
        </td>
        <td class="p-3.5 text-slate-600 font-medium">${row.borrowDate}</td>
        <td class="p-3.5 text-slate-600 font-medium">${row.dueDate}</td>
        <td class="p-3.5 text-slate-600 font-medium font-mono">${returnDateDisplay}</td>
        <td class="p-3.5 text-center">${badge}</td>
      </tr>`;

      tbody.innerHTML += rowHtml;

      if(adminApprovalTbody && row.status === "รออนุมัติ" && (activeRole === "ADMIN" || activeRole === "SUPER_ADMIN")) {
         adminApprovalTbody.innerHTML += `
           <tr class="border-b border-slate-100 bg-white text-xs">
             <td class="p-3 text-center font-mono font-bold text-slate-700">${row.transId}</td>
             <td class="p-3 font-semibold text-slate-900">${row.itemId}<br><span class="text-slate-400 font-normal">${row.itemName}</span></td>
             <td class="p-3 text-center font-bold">${row.qty} ชิ้น</td>
             <td class="p-3 font-medium">${row.borrowerName}<br><span class="text-xxs text-slate-400 font-mono">${row.borrowerEmail}</span></td>
             <td class="p-3 text-slate-500 truncate max-w-[150px]">${row.purpose}</td>
             <td class="p-3 text-slate-600 font-mono">${row.dueDate}</td>
             <td class="p-3 text-center space-x-1">
               <button onclick="executeApproveAction('${row.transId}', '${row.itemId}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-2.5 py-1.5 rounded-lg transition shadow-sm text-xxs">📋 อนุมัติ</button>
               <button onclick="executeRejectAction('${row.transId}', '${row.itemId}')" class="bg-rose-600 hover:bg-rose-700 text-white font-black px-2.5 py-1.5 rounded-lg transition shadow-sm text-xxs">❌ ปฏิเสธ</button>
             </td>
           </tr>`;
      }
    });

    const approvalBadgeEl = document.getElementById("nav-approval-badge");
    if(approvalBadgeEl) {
       if(approvalCountForBadge > 0 && (activeRole === "ADMIN" || activeRole === "SUPER_ADMIN")) {
          approvalBadgeEl.innerText = approvalCountForBadge;
          approvalBadgeEl.classList.remove("hidden");
       } else {
          approvalBadgeEl.classList.add("hidden");
       }
    }

    if(adminApprovalTbody && adminApprovalTbody.innerHTML === "" && (activeRole === "ADMIN" || activeRole === "SUPER_ADMIN")) {

  function switchTab(tabId, event = null) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  const currentTab = document.getElementById('tab-content-' + tabId);
  if(currentTab) currentTab.classList.remove('hidden');
  document.querySelectorAll('.sidebar-btn, .user-sidebar-btn').forEach(btn => {
    btn.classList.remove('bg-amber-500', 'text-slate-950', 'active');
    btn.classList.add('bg-transparent', 'text-slate-400');
  });
  
  if(event?.currentTarget) {
    event.currentTarget.classList.remove('bg-transparent', 'text-slate-400');
    event.currentTarget.classList.add('bg-amber-500', 'text-slate-950', 'active');
  } else {
    const fallbackBtn = document.querySelector(`button[onclick*="'${tabId}'"]`);
    if(fallbackBtn) {
       fallbackBtn.classList.remove('bg-transparent', 'text-slate-400');
       fallbackBtn.classList.add('bg-amber-500', 'text-slate-950', 'active');
    }
  }
  if(window.innerWidth < 1024) {
    const sidebar = document.getElementById("sidebar-menu");
    const overlay = document.getElementById("sidebar-overlay");
    if(sidebar) sidebar.classList.add("-translate-x-full");
    if(overlay) overlay.classList.add("hidden");
  }
}

  function openItemModal(mode, id="") { 
    const modal = document.getElementById("item-modal");
    if(modal) modal.classList.remove("hidden"); 
    
    if(document.getElementById("itemMode")) document.getElementById("itemMode").value = mode; 
    if(document.getElementById("item-modal-title")) {
      document.getElementById("item-modal-title").innerText = mode === "ADD" ? "➕ เพิ่มพัสดุครุภัณฑ์ใหม่" : "📝 แก้ไขข้อมูลพัสดุครุภัณฑ์"; 
    }
    tempItemBase64Str = "";
    if(document.getElementById("modalItemFile")) document.getElementById("modalItemFile").value = "";
    const prevImg = document.getElementById("modalItemImagePreview");
    if(prevImg) {
      prevImg.src = "";
      prevImg.classList.add("hidden");
    }
    if(mode === "EDIT" && id !== "") { 
      const item = ALL_ITEMS_CACHE.find(i => i.id === id); 
      if(item) { 
        if(document.getElementById("modalItemId")) { document.getElementById("modalItemId").value = item.id; document.getElementById("modalItemId").disabled = true; }
        if(document.getElementById("modalItemName")) document.getElementById("modalItemName").value = item.name; 
        if(document.getElementById("modalItemType")) document.getElementById("modalItemType").value = item.type || "ครุภัณฑ์";
        if(document.getElementById("modalItemQuantity")) document.getElementById("modalItemQuantity").value = item.quantity || 1;
        if(document.getElementById("modalItemLocation")) document.getElementById("modalItemLocation").value = item.location; 
        if(document.getElementById("modalItemStatus")) document.getElementById("modalItemStatus").value = item.status; 
        if(item.itemPic && prevImg) {
          prevImg.src = item.itemPic;
          prevImg.classList.remove("hidden");
        }
      } 
    } else { 
      if(document.getElementById("itemModalForm")) document.getElementById("itemModalForm").reset(); 
      if(document.getElementById("modalItemId")) document.getElementById("modalItemId").disabled = false; 
    } 
  }

  function handleBorrow(e) { e.preventDefault(); const itemId = document.getElementById("borrowItemId").value.trim(); const dueDate = document.getElementById("dueDate").value; const btn = document.getElementById("borrowSubmitBtn"); const name = MY_PROFILE_CACHE ? MY_PROFILE_CACHE.fullName : "User"; if(btn) { btn.disabled = true; btn.innerText = "กำลังบันทึก..."; } google.script.run.withSuccessHandler(function(res) { if(btn) { btn.disabled = false; btn.innerText = "ยืนยันคำขอยืม"; } if(res.success) { showToast(res.message, "success"); document.getElementById("borrowForm").reset(); evaluateDisplayState(); } else { showToast(res.message, "error"); } }).borrowItem(itemId, name, CURRENT_USER_EMAIL, dueDate); }
  function handleReturn(e) { e.preventDefault(); const itemId = document.getElementById("returnItemId").value.trim(); const btn = document.getElementById("returnSubmitBtn"); if(btn) { btn.disabled = true; btn.innerText = "กำลังบันทึก..."; } google.script.run.withSuccessHandler(function(res) { if(btn) { btn.disabled = false; btn.innerText = "ส่งคืนพัสดุเข้าคลัง"; } if(res.success) { showToast(res.message, "success"); document.getElementById("returnForm").reset(); evaluateDisplayState(); } else { showToast(res.message, "error"); } }).returnItem(itemId); }

  function updateCartFloatingBadge() {
    const badge = document.getElementById("cart-badge-count");
    if(!badge) return;
    if (MY_ASSET_CART.length > 0) {
      badge.innerText = MY_ASSET_CART.length;
      badge.classList.remove("hidden");
    } else {
      badge.classList.add("hidden");
    }
  }

  function addItemToCart(id) {
    const item = ALL_ITEMS_CACHE.find(i => i.id === id);
    if (!item) return;
    
    const exist = MY_ASSET_CART.find(c => c.id === id);
    if (exist) {
      if (exist.qty >= item.quantity) {
        showToast(`❌ ไม่สามารถเพิ่มจำนวนได้ เนื่องจากคลังพัสดุเหลือให้ยืมเพียง ${item.quantity} ชิ้น`, "error");
        return;
      }
      exist.qty += 1;
    } else {
      MY_ASSET_CART.push({ id: item.id, name: item.name, max: item.quantity, qty: 1, selected: true });
    }
    updateCartFloatingBadge();
    showToast(`🛒 เพิ่ม ${item.name} เข้าตะกร้าส่วนตัวแล้ว`, "success");
  }

  function openCartModal() {
    const modal = document.getElementById("cart-modal");
    if(modal) {
      modal.classList.remove("hidden");
      renderCartItemsList();
      validateCartBorrowDays();
    }
  }

  // ล้างตะกร้าค้างคาและจัดการปุ่มเลือกไอเทมตะกร้า
  function renderCartItemsList() {
    const container = document.getElementById("cart-items-list-container");
    if(!container) return;
    if (MY_ASSET_CART.length === 0) {
      container.innerHTML = `<div class="text-center p-6 text-slate-400 text-xs">🛒 ไม่มีอุปกรณ์ในตะกร้าส่วนบุคคลของคุณขณะนี้</div>`;
      return;
    }
    
    container.innerHTML = "";
    MY_ASSET_CART.forEach((item, index) => {
      let isChecked = item.selected ? "checked" : "";
      container.innerHTML += `
        <div class="flex items-center justify-between gap-2 p-3 bg-white border rounded-xl shadow-sm animate-fadeIn">
          <div class="flex items-center gap-2">
            <input type="checkbox" onchange="toggleSelectCartItem(${index})" ${isChecked} class="rounded border-slate-300">
            <div>
              <div class="font-bold text-slate-900 text-xs leading-tight">${item.name}</div>
              <div class="text-xxs font-mono text-slate-400 mt-0.5">${item.id} (สูงสุด ${item.max} ชิ้น)</div>
            </div>
          </div>
          
          <div class="flex items-center gap-2">
            <div class="flex items-center border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
              <button onclick="updateCartItemQty(${index}, -1)" class="px-2 py-1 text-xs font-bold hover:bg-slate-200 transition">-</button>
              <span class="px-2.5 text-xs font-mono font-bold text-slate-800">${item.qty}</span>
              <button onclick="updateCartItemQty(${index}, 1)" class="px-2 py-1 text-xs font-bold hover:bg-slate-200 transition">+</button>
            </div>
            <button onclick="removeCartItem(${index})" class="text-rose-500 hover:text-rose-700 text-xs p-1">🗑️</button>
          </div>
        </div>
      `;
    });
  }

  function updateCartItemQty(index, amount) {
    const item = MY_ASSET_CART[index];
    let newQty = item.qty + amount;
    if (newQty < 1) return;
    if (newQty > item.max) {
      showToast(`❌ ขออภัย พัสดุชิ้นนี้ในคลังเหลือจำกัดเพียง ${item.max} ชิ้นเท่านั้น`, "error");
      return;
    }
    item.qty = newQty;
    renderCartItemsList();
  }

  function removeCartItem(index) {
    showToast(`ลบ ${MY_ASSET_CART[index].name} ออกจากตะกร้าแล้ว`, "success");
    MY_ASSET_CART.splice(index, 1);
    updateCartFloatingBadge();
    renderCartItemsList();
  }

  function toggleSelectCartItem(index) {
    MY_ASSET_CART[index].selected = !MY_ASSET_CART[index].selected;
  }

  function toggleSelectAllCartItems(masterCheckbox) {
    MY_ASSET_CART.forEach(item => item.selected = masterCheckbox.checked);
    renderCartItemsList();
  }

  function clearAllCart() {
    MY_ASSET_CART = [];
    updateCartFloatingBadge();
    renderCartItemsList();
    showToast("ล้างรายการตะกร้าส่วนบุคคลเรียบร้อยแล้ว", "success");
  }

  function syncCartDataWithCache() {
    MY_ASSET_CART.forEach(item => {
      const match = ALL_ITEMS_CACHE.find(i => i.id === item.id);
      if (match) {
        item.max = match.quantity;
        if (item.qty > item.max) item.qty = item.max;
      }
    });
    const modal = document.getElementById("cart-modal");
    if(modal && !modal.classList.contains("hidden")) {
      renderCartItemsList();
    }
  }

  function validateCartBorrowDays() {
    const bDateInput = document.getElementById("cartBorrowDate");
    const dDateInput = document.getElementById("cartDueDate");
    const warning = document.getElementById("cart-date-warning");
    if(bDateInput) bDateInput.classList.remove("border-rose-500", "bg-rose-50");
    if(dDateInput) dDateInput.classList.remove("border-rose-500", "bg-rose-50");
    if(!bDateInput || !dDateInput || !bDateInput.value || !dDateInput.value) return true;
    const bDate = new Date(bDateInput.value);
    const dDate = new Date(dDateInput.value);
    if (dDate < bDate) {
      if(warning) {
        warning.innerText = "❌ วันกำหนดส่งคืน ห้ามอยู่ก่อน วันที่ขอยืมพัสดุ";
        warning.classList.remove("hidden");
      }
      dDateInput.classList.add("border-rose-500", "bg-rose-50");
      return false;
    }
    const diffTime = Math.abs(dDate - bDate);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    if (diffDays > 30) {
      if(warning) {
        warning.innerText = `❌ วันกำหนดส่งคืนห่างกันเกินไป (${diffDays} วัน) ระบบล็อกสิทธิ์ห้ามขอยืมเกิน 30 วัน!`;
        warning.classList.remove("hidden");
      }
      dDateInput.classList.add("border-rose-500", "bg-rose-50");
      return false;
    } else {
      if(warning) warning.classList.add("hidden");
      return true;
    }
  }

  function submitCartBorrow() {
    const activeItems = MY_ASSET_CART.filter(item => item.selected);
    if (activeItems.length === 0) {
      showToast("❌ กรุณาติ๊กเลือกพัสดุที่ต้องการยืมในตะกร้าอย่างน้อย 1 รายการ", "error");
      return;
    }
    const purposeEl = document.getElementById("cartPurpose");
    const bDateInput = document.getElementById("cartBorrowDate");
    const dDateInput = document.getElementById("cartDueDate");
    if(purposeEl) purposeEl.classList.remove("border-rose-500", "bg-rose-50");
    if(bDateInput) bDateInput.classList.remove("border-rose-500", "bg-rose-50");
    if(dDateInput) dDateInput.classList.remove("border-rose-500", "bg-rose-50");
    if (!purposeEl || purposeEl.value.trim() === "") {
      showToast("❌ กรุณาระบุจุดประสงค์การนำไปใช้งานก่อนส่งคำขอยืม", "error");
      if(purposeEl) {
        purposeEl.classList.add("border-rose-500", "bg-rose-50");
        purposeEl.focus(); 
      }
      return;
    }
    if (!bDateInput || bDateInput.value === "") {
      showToast("❌ กรุณาระบุ วันที่ขอยืมพัสดุ ให้ครบถ้วน", "error");
      if(bDateInput) {
        bDateInput.classList.add("border-rose-500", "bg-rose-50");
        bDateInput.focus();
      }
      return;
    }
    if (!dDateInput || dDateInput.value === "") {
      showToast("❌ กรุณาระบุ วันกำหนดส่งคืนคลัง ให้ครบถ้วน", "error");
      if(dDateInput) {
        dDateInput.classList.add("border-rose-500", "bg-rose-50");
        dDateInput.focus();
      }
      return;
    }
    if (!validateCartBorrowDays()) {
      showToast("❌ เงื่อนไขวันที่ไม่ถูกต้อง หรือเกินระยะเวลา 30 วันที่กำหนด", "error");
      if(dDateInput) dDateInput.focus();
      return;
    }
    const purpose = purposeEl.value.trim();
    const bDateStr = bDateInput.value;
    const dDateStr = dDateInput.value;
    const submitBtn = document.getElementById("cartSubmitBtn");
    const borrowerName = MY_PROFILE_CACHE ? MY_PROFILE_CACHE.fullName : "User";
    if(submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังส่งคำขอตัดสต็อกชีต...";
    }
    google.script.run.withSuccessHandler(function(res) {
      if(submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 ยืนยันการยืมพัสดุทั้งหมด";
      }
      if (res.success) {
        showToast(res.message, "success");
        MY_ASSET_CART = MY_ASSET_CART.filter(item => !item.selected);
        updateCartFloatingBadge();
        if(purposeEl) purposeEl.value = "";
        closeModal("cart-modal");
        loadDashboard();
        evaluateDisplayState();
      } else {
        showToast(res.message, "error");
      }
    }).borrowCartItems(activeItems, borrowerName, CURRENT_USER_EMAIL, bDateStr, dDateStr, purpose);
  }

function openUserModal(mode, username = "") {
  const modal = document.getElementById("user-modal");
  if(modal) {
    modal.classList.remove("hidden");
  }
  document.getElementById("userMode").value = mode;
  const title = document.getElementById("user-modal-title");
  const usernameInput = document.getElementById("modalUsername");
  const passwordInput = document.getElementById("modalPassword");
  const roleInput = document.getElementById("modalRole");
  if(mode === "ADD") {
    if(title) {
      title.innerText = "➕ เพิ่มผู้ใช้งานใหม่";
    }
    usernameInput.value = "";
    passwordInput.value = "";
    roleInput.value = "USER";
    usernameInput.removeAttribute("readonly");
  } else {
    if(title) {
      title.innerText = "📝 แก้ไขสิทธิ์ผู้ใช้งาน";
    }
    const user =
      ALL_USERS_CACHE.find(u => u.username === username);
    if(!user) {
      showToast("ไม่พบข้อมูลผู้ใช้งาน", "error");
      return;
    }
    usernameInput.value = user.username;
    passwordInput.value = "";
    roleInput.value = user.role;
    usernameInput.setAttribute("readonly", true);
  }
}

function submitUserForm(event) {
  event.preventDefault();
  const mode =
    document.getElementById("userMode").value;
  const username =
    document.getElementById("modalUsername").value.trim();
  const password =
    document.getElementById("modalPassword").value.trim();
  const role =
    document.getElementById("modalRole").value;
  if(username === "") {
    showToast("กรุณากรอก Username", "error");
    return;
  }
  if(mode === "ADD" && password === "") {
    showToast("กรุณากรอก Password", "error");
    return;
  }
  const submitBtn =
    document.querySelector("#userModalForm button[type='submit']");
  if(submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerText = "กำลังบันทึก...";
  }
  google.script.run
    .withSuccessHandler(function(res) {
      if(submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = "บันทึกข้อมูล";
      }
      if(res.success) {
        showToast(res.message, "success");
        closeModal("user-modal");
        loadDashboard();
      } else {
        showToast(res.message, "error");
      }
    })
    .withFailureHandler(function(err) {
      if(submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = "บันทึกข้อมูล";
      }
      showToast("เกิดข้อผิดพลาด : " + err.message, "error");
    })
    .saveUserData(mode, username, role, password);
}

function deleteUserAction(username) {
  if(!confirm("ต้องการลบผู้ใช้งาน " + username + " ใช่หรือไม่ ?")) {
    return;
  }
  google.script.run
    .withSuccessHandler(function(res) {
      if(res.success) {
        showToast(res.message, "success");
        loadDashboard();
      } else {
        showToast(res.message, "error");
      }
    })
    .withFailureHandler(function(err) {
      showToast("เกิดข้อผิดพลาด : " + err.message, "error");
    })
    .deleteUserData(username);
}
