<script>
  let tempItemBase64Str = ""; 
  let autoRefreshInterval = null;
  const $id = (id) => document.getElementById(id);
  const EXPAND_PAGE_SIZE = 1000000;

  document.addEventListener("DOMContentLoaded", function() {
    evaluateDisplayState();
    const bDateEl = document.getElementById("cartBorrowDate");
    if(bDateEl) {
      const today = new Date().toISOString().split('T')[0];
      bDateEl.value = today;
    }
  });

  function showToast(message, type = "success") {
    const container = document.getElementById("toast-container");
    if (!container) return;
    const toast = document.createElement("div");
    toast.className = `flex items-center p-3.5 rounded-xl shadow-xl text-xs font-bold tracking-wide border transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto bg-white animate-fadeIn`;
    if (type === "success") {
      toast.classList.add("border-emerald-200", "text-emerald-800", "bg-emerald-50/90");
      toast.innerHTML = `<span class="text-base mr-2">✅</span> <div>${message}</div>`;
    } else {
      toast.classList.add("border-rose-200", "text-rose-900", "bg-rose-50/90");
      toast.innerHTML = `<span class="text-base mr-2"> ❌ </span> <div>${message}</div>`;
    }
    container.appendChild(toast);
    setTimeout(() => { toast.classList.remove("translate-y-2", "opacity-0"); }, 10);
    setTimeout(() => {
      toast.classList.add("translate-y-[-10px]", "opacity-0");
      setTimeout(() => { toast.remove(); }, 300);
    }, 4000);
  }

  function toggleAuthBox(mode) {
    const regMsg = document.getElementById("reg-error-msg");
    const loginMsg = document.getElementById("login-error-msg");
    const loginBox = document.getElementById("login-box");
    const regBox = document.getElementById("register-box");
    if(regMsg) regMsg.classList.add("hidden");
    if(loginMsg) loginMsg.classList.add("hidden");
    if(mode === 'REG') {
      if(loginBox) loginBox.classList.add("hidden");
      if(regBox) regBox.classList.remove("hidden");
    } else {
      if(loginBox) loginBox.classList.remove("hidden");
      if(regBox) regBox.classList.add("hidden");
    }
  }

  function fileToBase64(fileInput, callback) {
    if (fileInput && fileInput.files && fileInput.files[0]) {
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const MAX_SIDE_LEN = 400; 
          if (width > height) {
            if (width > MAX_SIDE_LEN) { height *= MAX_SIDE_LEN / width; width = MAX_SIDE_LEN; }
          } else {
            if (height > MAX_SIDE_LEN) { width *= MAX_SIDE_LEN / height; height = MAX_SIDE_LEN; }
          }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    } else { callback(""); }
  }

  function previewItemFileImage(input) {
    if (input.files && input.files[0]) {
      fileToBase64(input, function(base64Data) {
        tempItemBase64Str = base64Data;
        const imgPrev = document.getElementById("modalItemImagePreview");
        if(imgPrev) {
          imgPrev.src = base64Data;
          imgPrev.classList.remove("hidden");
        }
      });
    }
  }

  function executeRegister(e) {
    e.preventDefault();
    const name = document.getElementById("regFullName").value;
    const email = document.getElementById("regEmail").value;
    const user = document.getElementById("regUsername").value;
    const pass = document.getElementById("regPassword").value;
    const confirmPass = document.getElementById("regConfirmPassword").value;
    const fileEl = document.getElementById("regProfilePic");
    const errEl = document.getElementById("reg-error-msg");
    const btn = document.getElementById("regBtn");
    if(errEl) errEl.classList.add("hidden");
    if (pass.length < 6) { 
      if(errEl) { errEl.innerText = "❌ รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร"; errEl.classList.remove("hidden"); }
      return; 
    }
    if (pass !== confirmPass) { 
      if(errEl) { errEl.innerText = "❌ รหัสผ่านไม่ตรงกัน"; errEl.classList.remove("hidden"); }
      return; 
    }
    if(btn) { btn.disabled = true; btn.innerText = "กำลังสมัครสมาชิก..."; }
    fileToBase64(fileEl, function(base64Data) {
      google.script.run
        .withSuccessHandler(function(res) {
          if(btn) { btn.disabled = false; btn.innerText = "✅ ยืนยันสมัครสมาชิก"; }
          if(res.success) { 
            showToast(res.message, "success");
            toggleAuthBox('LOG'); 
          } else { 
            if(errEl) { errEl.innerText = res.message; errEl.classList.remove("hidden"); }
            showToast(res.message, "error");
          }
        })
        .registerNewUser(user, pass, name, email, base64Data);
    });
  }

  function executeLogin(e) {
    e.preventDefault();
    const userEl = document.getElementById("loginUsername");
    const passEl = document.getElementById("loginPassword");
    const errEl = document.getElementById("login-error-msg");
    const btnEl = document.getElementById("loginBtn");
    if(errEl) errEl.classList.add("hidden"); 
    if(btnEl) { btnEl.disabled = true; btnEl.innerText = "กำลังตรวจสอบ..."; }
    google.script.run
      .withSuccessHandler(function(res) {
      if(btnEl) {
        btnEl.disabled = false;
        btnEl.innerText = "🔑 เข้าสู่ระบบ";
      }
      if (res.success) {
        CURRENT_USER_EMAIL = res.username;
        CURRENT_USER_ROLE = res.role;
        IS_PROFILE_COMPLETE = res.isProfileComplete;
        MY_PROFILE_CACHE = res.profile;
        showToast(res.message, "success");
        evaluateDisplayState();
        startAutoRefresh();
      } else {
        if(errEl) {
          errEl.innerText = res.message;
          errEl.classList.remove("hidden");
        }
        showToast(res.message, "error");
      }
    }).processFormLogin(userEl.value, passEl.value);
  }

 function startAutoRefresh() {
   console.log("Auto Refresh System Started");
   if (autoRefreshInterval) {
     clearInterval(autoRefreshInterval);
   }
   autoRefreshInterval = setInterval(() => {
     console.log("Auto-refreshing dashboard data...");
     try {
       if (typeof loadDashboard === "function") {
         loadDashboard();
       }
       if (
         CURRENT_USER_ROLE === "SUPER_ADMIN" &&
         typeof loadExecutiveReport === "function"
       ) {
         loadExecutiveReport();
       }
       if (typeof loadUserHistoryData === "function") {
         loadUserHistoryData();
       }
     } catch(err) {
       console.error("Auto Refresh Error :", err);
     }
   }, 180000);
 }

  function executeLogout() { 
    const modal = document.getElementById("logout-confirm-modal");
    if(modal) modal.classList.remove("hidden"); 
  }
  
  function confirmLogoutAction() {
   CURRENT_USER_EMAIL = "";
   CURRENT_USER_ROLE = "USER";
   IS_PROFILE_COMPLETE = true;
   MY_PROFILE_CACHE = null;
   MY_ASSET_CART = [];
   updateCartFloatingBadge();
   closeModal('logout-confirm-modal');
   closeModal('cart-modal');
   switchTab('borrow-tab');
   evaluateDisplayState();
   showToast("ออกจากระบบเรียบร้อยแล้ว", "success");
 }

  function evaluateDisplayState() {
    const authScreen = document.getElementById("auth-screen");
    const mainApp = document.getElementById("main-application");
    const adminMenu = document.getElementById("admin-nav-menu");
    const userMenu = document.getElementById("user-nav-menu");
    const barrierBanner = document.getElementById("profile-barrier-banner");
    const borrowReturnFieldset = document.getElementById("borrow-return-fieldset");
    const personalHistoryBox = document.getElementById("personal-history-box");
    const floatingCartBtn = document.getElementById("floating-cart-btn");
    const reportTab = document.getElementById("tab-content-report-tab");
    const borrowTab = document.getElementById("tab-content-borrow-tab");
    const userItemsTab = document.getElementById("tab-content-user-items-tab");
    const sectionDashboard = document.getElementById("section-dashboard");

    // Force mobile-first view for regular USER accounts: add/remove a body class
    try {
      if (typeof CURRENT_USER_ROLE !== 'undefined' && CURRENT_USER_ROLE === 'USER' && CURRENT_USER_EMAIL !== "") {
        document.body.classList.add('force-mobile-view');
      } else {
        document.body.classList.remove('force-mobile-view');
      }
    } catch (e) { /* ignore if body not ready */ }

    if (CURRENT_USER_EMAIL !== "") {
      if(authScreen) authScreen.classList.add("hidden"); 
      if(mainApp) mainApp.classList.remove("hidden");
      const emailDisplay = document.getElementById("user-display-email");
      const roleBadge = document.getElementById("role-badge");
      if(emailDisplay) emailDisplay.innerText = CURRENT_USER_EMAIL;
      if(roleBadge) roleBadge.innerText = CURRENT_USER_ROLE;
      loadDashboard();
      const avatarEl = document.getElementById("nav-avatar");
      const mobileAvatarEl = document.getElementById("mobile-nav-avatar");
      const roleBadgeMobile = document.getElementById("role-badge-mobile");
      if(roleBadgeMobile) roleBadgeMobile.innerText = CURRENT_USER_ROLE;
      if(MY_PROFILE_CACHE && MY_PROFILE_CACHE.profilePic && MY_PROFILE_CACHE.profilePic !== "") {
        if(avatarEl) { avatarEl.src = MY_PROFILE_CACHE.profilePic; avatarEl.classList.remove("hidden"); }
        if(mobileAvatarEl) { mobileAvatarEl.src = MY_PROFILE_CACHE.profilePic; mobileAvatarEl.classList.remove("hidden"); }
      } else {
        if(avatarEl) avatarEl.classList.add("hidden");
        if(mobileAvatarEl) mobileAvatarEl.classList.add("hidden");
      }
      if (!IS_PROFILE_COMPLETE) {
        if(barrierBanner) barrierBanner.classList.remove("hidden");
        if(borrowReturnFieldset) borrowReturnFieldset.disabled = true;
        if(floatingCartBtn) floatingCartBtn.classList.add("hidden");
        openMyProfileModal(); 
        return;
      } else {
        if(barrierBanner) barrierBanner.classList.add("hidden");
        if(borrowReturnFieldset) borrowReturnFieldset.disabled = false;
      }
      if (CURRENT_USER_ROLE === "SUPER_ADMIN") {
       if(reportTab) reportTab.classList.remove("hidden");
       if(borrowTab) borrowTab.classList.add("hidden");
       if(userItemsTab) userItemsTab.classList.add("hidden");
       if(adminMenu) adminMenu.classList.remove("hidden");
       document.querySelectorAll("#admin-nav-menu .sidebar-btn")
       .forEach(btn => btn.classList.add("hidden"));
       document.getElementById("nav-report-btn")
       ?.classList.remove("hidden");
       CURRENT_EXECUTIVE_FILTER = "MONTH";
       changeExecutiveFilter("MONTH");
      } else if (CURRENT_USER_ROLE === "ADMIN") {
        if(reportTab) reportTab.classList.add("hidden");
        
        switchTab('approval-tab'); 
        
        if(borrowReturnFieldset) borrowReturnFieldset.classList.add("hidden"); 
        if(personalHistoryBox) personalHistoryBox.classList.remove("hidden");
        if(sectionDashboard) sectionDashboard.classList.remove("hidden");
        if(adminMenu) adminMenu.classList.remove("hidden"); 
        if(userMenu) userMenu.classList.add("hidden");
        if(floatingCartBtn) floatingCartBtn.classList.remove("hidden");
        CURRENT_EXECUTIVE_FILTER = "MONTH";
        changeExecutiveFilter("MONTH");
        if (typeof loadUserHistoryData === "function") loadUserHistoryData();
      } else {
  if(reportTab) reportTab.classList.add("hidden");
  // Do not forcibly hide items tab for regular USERs — allow user to open the full items list (items-tab)
  // if(userItemsTab) userItemsTab.classList.add("hidden");
  if(borrowTab) borrowTab.classList.remove("hidden");
        if(borrowReturnFieldset) borrowReturnFieldset.classList.add("hidden");
        if(personalHistoryBox) personalHistoryBox.classList.remove("hidden");
        if(sectionDashboard) sectionDashboard.classList.add("hidden"); 
        if(adminMenu) adminMenu.classList.add("hidden"); 
        if(userMenu) userMenu.classList.remove("hidden");
        if(floatingCartBtn) floatingCartBtn.classList.remove("hidden");
        // Ensure mobile-friendly top tabs are present for USERs when sidebar is hidden
        try {
          if (typeof CURRENT_USER_ROLE !== 'undefined' && CURRENT_USER_ROLE === 'USER') {
            const mainEl = document.querySelector('main');
            if (mainEl) {
              let mobileTabs = document.getElementById('mobile-top-tabs');
              if (!mobileTabs) {
                mobileTabs = document.createElement('div');
                mobileTabs.id = 'mobile-top-tabs';
                mobileTabs.className = 'mb-4 flex gap-2';
                const b1 = document.createElement('button');
                b1.setAttribute('data-tab','borrow-tab');
                b1.className = 'px-3 py-2 rounded-md bg-amber-500 text-slate-900 font-bold';
                b1.innerText = '🔄 งานยืม-คืน พัสดุ';
                b1.onclick = (e) => switchTab('borrow-tab', e);
                const b2 = document.createElement('button');
                b2.setAttribute('data-tab','user-items-tab');
                b2.className = 'px-3 py-2 rounded-md bg-slate-100 text-slate-700 font-bold';
                b2.innerText = '📦 พัสดุครุภัณฑ์ทั้งหมด';
                b2.onclick = (e) => switchTab('user-items-tab', e);
                mobileTabs.appendChild(b1);
                mobileTabs.appendChild(b2);
                mainEl.insertBefore(mobileTabs, mainEl.firstChild);
              } else {
                mobileTabs.classList.remove('hidden');
              }
            }
            }
            // Hide admin-only add button for USER
            try {
              const addBtn = document.getElementById('admin-add-item-btn');
              if (addBtn) {
                if (CURRENT_USER_ROLE === 'ADMIN' || CURRENT_USER_ROLE === 'SUPER_ADMIN') {
                  addBtn.classList.remove('hidden');
                } else {
                  addBtn.classList.add('hidden');
                }
              }
            } catch(e) { /* ignore */ }
        } catch(e) { console.warn('mobile-top-tabs init failed', e); }

        loadUserHistoryData();
      }
    } else { 
      if(authScreen) authScreen.classList.remove("hidden"); 
      if(mainApp) mainApp.classList.add("hidden"); 
      if(floatingCartBtn) floatingCartBtn.classList.add("hidden"); 
    }
  }

  function changeExecutiveFilter(type) { CURRENT_EXECUTIVE_FILTER = type; loadExecutiveReport(); }

  function loadExecutiveReport() {
    document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("bg-slate-900", "text-amber-400"); 
      btn.classList.add("text-slate-600");
    });
  const activeBtn = document.getElementById("btn-filter-" + CURRENT_EXECUTIVE_FILTER);
    if(activeBtn) {
      activeBtn.classList.add("bg-slate-900", "text-amber-400"); 
      activeBtn.classList.remove("text-slate-600");
      }
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) return;
        document.getElementById("kpi-total-items").innerText = res.kpi.totalItems;
        document.getElementById("kpi-avail-items").innerText = res.kpi.availableItems;
        document.getElementById("kpi-borrow-items").innerText = res.kpi.borrowedItems;
        document.getElementById("kpi-range-borrows").innerText = res.kpi.rangeBorrows;
        document.getElementById("kpi-range-pending").innerText = res.kpi.rangePending;
        document.getElementById("kpi-range-returned").innerText = res.kpi.rangeReturned;
        if (locationChartInstance) locationChartInstance.destroy();
        const pieCanvas = document.getElementById('locationPieChart');
 if (pieCanvas) {
  const ctxPie = pieCanvas.getContext('2d');
  locationChartInstance = new Chart(ctxPie, {
    type: 'pie',
    data: {
      labels: res.charts.locationLabels.length > 0
        ? res.charts.locationLabels
        : ["ไม่มีข้อมูล"],
      datasets: [{
        data: res.charts.locationValues.length > 0
          ? res.charts.locationValues
          : [0],
        backgroundColor: [
          '#0f172a',
          '#d97706',
          '#64748b',
          '#475569',
          '#cbd5e1'
        ]
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
 }
        if (itemsChartInstance) itemsChartInstance.destroy();
        const ctxBar = document.getElementById('itemsBarChart').getContext('2d');
        if(ctxBar) {
          itemsChartInstance = new Chart(ctxBar, {
            type: 'bar',
            data: {
              labels: res.charts.itemLabels.length > 0 ? res.charts.itemLabels : ["ไม่มีข้อมูล"],
              datasets: [{ label: 'ความถี่การยืม (ครั้ง)', data: res.charts.itemValues.length > 0 ? res.charts.itemValues : [0], backgroundColor: '#0f172a', borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
          });
        }
      }).getExecutiveReportData(CURRENT_EXECUTIVE_FILTER);
  }

/* เพิ่ม helper สำหรับเรนเดอร์รายการประวัติ (reuse) */
function _renderHistoryRows(tbody, adminApprovalTbody, rows, activeRole) {
  if (!tbody) return;
  tbody.innerHTML = "";
  if (adminApprovalTbody) adminApprovalTbody.innerHTML = "";

  let approvalCountForBadge = 0;

  rows.forEach(function(row) {
    // 1. กำหนด Badge สถานะ (ใช้เหมือนกันทั้ง USER และ ADMIN)
    let badge = "";
    if (row.status === "รออนุมัติ") {
      approvalCountForBadge++;
      badge = `<span class="status-pill inline-flex items-center gap-1.5 bg-amber-50 text-amber-800 text-xs font-bold px-3 py-1 rounded-full border border-amber-200">
                 <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> ⏳ รออนุมัติจากเจ้าหน้าที่
               </span>`;
    } else if (row.status === "กำลังยืม") {
      badge = `<span class="status-pill inline-flex items-center gap-1.5 bg-rose-50 text-rose-700 text-xs font-bold px-3 py-1 rounded-full border border-rose-100">
                 <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span> ค้างคืนอุปกรณ์
               </span>`;
    } else if (row.status === "ไม่อนุมัติ") {
      badge = `<span class="status-pill inline-flex items-center gap-1.5 bg-red-50 text-red-700 text-xs font-bold px-3 py-1 rounded-full border border-red-200">
                 <span class="w-2 h-2 rounded-full bg-red-500"></span> ❌ ปฏิเสธคำขอยืม
               </span>`;
    } else {
      badge = `<span class="status-pill inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full border border-emerald-100">
                 <span class="w-2 h-2 rounded-full bg-emerald-500"></span> ส่งคืนคลังแล้ว
               </span>`;
    }


    let returnDateDisplay = (row.status === "กำลังยืม" || row.status === "รออนุมัติ" || row.status === "ไม่อนุมัติ") ? "-" : (row.returnDate || "-");

    // 2. เงื่อนไขการเรนเดอร์แยกตามสิทธิ์
    if (activeRole === "USER") {
      // ตารางรูปแบบใหม่สำหรับ USER
      let rowHtml = `
      <tr onclick="openTxDetailsModal(${JSON.stringify(row).replace(/"/g, '&quot;')})" class="hover:bg-slate-50 transition border-b border-slate-100 bg-white cursor-pointer">
        <td data-label="รหัสพัสดุ" class="p-4 font-mono font-bold text-slate-900">${row.itemId}</td>
        <td data-label="ชื่อรายการ" class="p-4 font-medium text-slate-700">${row.itemName}</td>
        <td data-label="จำนวน" class="p-4 text-center font-bold text-slate-800">${row.qty}</td>
        <td data-label="ผู้ยืม" class="p-4">
          <div class="text-sm font-bold text-slate-800">${row.borrowerName || '-'}</div>
          <div class="text-xs text-slate-500 font-mono">${row.borrowerEmail || '-'}</div>
        </td>
        <td data-label="วันที่ยืม" class="p-4 text-slate-600">${row.borrowDate}</td>
        <td data-label="กำหนดคืน" class="p-4 text-slate-600">${row.dueDate}</td>
        <td data-label="คืนจริง" class="p-4 font-mono text-slate-700">${returnDateDisplay}</td>
        <td data-label="สถานะ" class="p-4 text-right">${badge}</td>
      </tr>`;
      tbody.innerHTML += rowHtml;
    } else {
      // ตารางรูปแบบเดิมสำหรับ ADMIN/SUPER_ADMIN (รักษาโครงสร้างเดิมที่แอดมินคุ้นเคย)
      let rowHtml = `
      <tr onclick="openTxDetailsModal(${JSON.stringify(row).replace(/"/g, '&quot;')})" class="hover:bg-slate-50 transition border-b border-slate-100 bg-white cursor-pointer">
        <td class="p-3 text-center font-mono font-bold text-slate-900">${row.itemId}</td>
        <td class="p-3 font-medium text-slate-700">${row.itemName}</td>
        <td class="p-3 text-center font-bold text-slate-800">${row.qty} ชิ้น</td>
        <td class="p-3 text-slate-600">
          <div class="text-xs">${row.borrowerName || '-'}</div>
          <div class="text-xxs text-slate-400 font-mono">${row.borrowerEmail || '-'}</div>
        </td>
        <td class="p-3 text-slate-600 font-medium">${row.borrowDate}</td>
        <td class="p-3 text-slate-600 font-medium">${row.dueDate}</td>
        <td class="p-3 text-slate-600 font-medium font-mono">${returnDateDisplay}</td>
        <td class="p-3 text-center">${badge}</td>
      </tr>`;
      tbody.innerHTML += rowHtml;
    }

    // 3. ส่วนของตารางอนุมัติสำหรับ Admin (คงไว้เหมือนเดิม)
    if (adminApprovalTbody && row.status === "รออนุมัติ" && (activeRole === "ADMIN" || activeRole === "SUPER_ADMIN")) {
      adminApprovalTbody.innerHTML += `
         <tr class="border-b border-slate-100 bg-white text-xs">
           <td class="p-3 text-center font-mono font-bold text-slate-700">${row.transId}</td>
           <td class="p-3 font-semibold text-slate-900">${row.itemId}<br><span class="text-slate-400 font-normal">${row.itemName}</span></td>
           <td class="p-3 text-center font-bold">${row.qty} ชิ้น</td>
           <td class="p-3 font-medium">${row.borrowerName || '-'}<br><span class="text-xxs text-slate-400 font-mono">${row.borrowerEmail || '-'}</span></td>
           <td class="p-3 text-slate-500 truncate max-w-[150px]">${row.purpose || '-'}</td>
           <td class="p-3 text-slate-600 font-mono">${row.dueDate}</td>
           <td class="p-3 text-center space-x-1">
             <button onclick="executeApproveAction('${row.transId}', '${row.itemId}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-2.5 py-1.5 rounded-lg transition shadow-sm text-xxs">📋 อนุมัติ</button>
             <button onclick="executeRejectAction('${row.transId}', '${row.itemId}')" class="bg-rose-600 hover:bg-rose-700 text-white font-black px-2.5 py-1.5 rounded-lg transition shadow-sm text-xxs">❌ ปฏิเสธ</button>

           </td>
         </tr>`;
    }
  });

  // อัปเดต Badge แจ้งเตือน
  const approvalBadgeEl = document.getElementById("nav-approval-badge");
  if (approvalBadgeEl) {

/* แก้ไข loadUserHistoryData ให้เรนเดอร์ 5 รายการแรก และแสดงปุ่ม "ดูเพิ่มเติมทั้งหมด" เมื่อจำเป็น */
// ให้ตัวแปรสถานะอยู่ระดับ global ของหน้า
window.USER_HISTORY_EXPANDED = window.USER_HISTORY_EXPANDED || false;

// แสดง 5 รายการล่าสุดเป็นค่าเริ่มต้น และเตรียมปุ่ม "ดูเพิ่มเติมทั้งหมด"
function loadUserHistoryData() {
  const PAGE_SIZE = 5;
  window.USER_HISTORY_EXPANDED = false;

  const activeEmail = (typeof CURRENT_USER_EMAIL !== "undefined" ? CURRENT_USER_EMAIL : (window && window.CURRENT_USER_EMAIL)) || "";
  const activeRole = (typeof CURRENT_USER_ROLE !== "undefined" ? CURRENT_USER_ROLE : (window && window.CURRENT_USER_ROLE)) || "USER";
  const tbody = document.getElementById("user-history-tbody");
  const moreRow = document.getElementById("user-history-more-row");
  const moreBtn = document.getElementById("load-more-history-btn");
  const adminApprovalTbody = document.getElementById("admin-approval-tbody");
  const fbFallback = document.getElementById("user-history-more-row-fallback");

  if (!tbody) return;
  if (moreRow) moreRow.classList.add("hidden");
  if (fbFallback) fbFallback.remove();
  if (adminApprovalTbody) adminApprovalTbody.innerHTML = "";

  if (!activeEmail) {
    tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400 bg-gray-50/50">โปรดล็อกอินเพื่อดูข้อมูล</td></tr>`;
    return;
  }

  let timeoutId = setTimeout(() => {
    if (tbody && tbody.innerHTML.trim() === "") {
      tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400 bg-gray-50/50">ไม่สามารถเรียกข้อมูลได้ กรุณาลองใหม่</td></tr>`;
    }
    if (moreRow) moreRow.classList.add("hidden");
  }, 10000);

  google.script.run
    .withSuccessHandler(function(res) {
      clearTimeout(timeoutId);
      if (!res || !res.success) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400 bg-gray-50/50">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
        if (moreRow) moreRow.classList.add("hidden");
        return;
      }

      const rows = Array.isArray(res.history) ? res.history : [];
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400 bg-gray-50/50">📝 ไม่พบประวัติ</td></tr>`;
        if (moreRow) moreRow.classList.add("hidden");
        if (adminApprovalTbody) adminApprovalTbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400 bg-gray-50/50">🎉 ไม่มีคำขอยืมรออนุมัติ</td></tr>`;
        return;
      }

      // แสดงเฉพาะ 5 รายการล่าสุด (initial)
      const initialRows = rows.slice(0, PAGE_SIZE);
      _renderHistoryRows(tbody, adminApprovalTbody, initialRows, activeRole);

      // เงื่อนไขการแสดงปุ่ม: server แจ้ง hasMore / total > shown / หรือได้ครบหน้า (fallback) / หรือ total === PAGE_SIZE (ให้กดดูทั้งหมดได้)
      const hasMoreFlag = (typeof res.hasMore !== "undefined") ? !!res.hasMore : undefined;
      const totalFromServer = (typeof res.total === "number") ? res.total : null;
      const shouldShowMore = (hasMoreFlag === true)
                          || (totalFromServer !== null && totalFromServer > rows.length)
                          || (typeof hasMoreFlag === "undefined" && rows.length >= PAGE_SIZE)
                          || (totalFromServer !== null && totalFromServer === PAGE_SIZE && rows.length >= PAGE_SIZE);

      if (shouldShowMore) {
        // ถ้ามี tfoot ใช้ tfoot
        if (moreRow) {
          moreRow.classList.remove("hidden");
          if (moreBtn) {
            moreBtn.disabled = false;
            moreBtn.innerText = "🔎 ดูเพิ่มเติมทั้งหมด";
            moreBtn.onclick = function() { toggleLoadMore(); };
          }
        } else {
          // fallback สร้างปุ่มใต้ตาราง
          const table = tbody.closest('table') || document.getElementById('user-history-table');
          if (table) {
            let fallback = document.getElementById('user-history-more-row-fallback');
            if (!fallback) {
              fallback = document.createElement('div');
              fallback.id = 'user-history-more-row-fallback';
              fallback.style.padding = '0.75rem';
              fallback.style.textAlign = 'center';
              fallback.innerHTML = `<button id="load-more-history-btn-fallback" class="px-4 py-2 bg-slate-900 text-amber-400 rounded-lg font-bold">🔎 ดูเพิ่มเติมทั้งหมด</button>`;
              table.parentNode.insertBefore(fallback, table.nextSibling);
            }
            const fbBtn = document.getElementById('load-more-history-btn-fallback');
            if (fbBtn) {
              fbBtn.disabled = false;
              fbBtn.innerText = "🔎 ดูเพิ่มเติมทั้งหมด";
              fbBtn.onclick = function() { toggleLoadMore(); };
            }
          }
        }
      } else {
        if (moreRow) moreRow.classList.add("hidden");
        const fbEl = document.getElementById('user-history-more-row-fallback');
        if (fbEl) fbEl.remove();
      }
    })
    .withFailureHandler(function(err) {
      clearTimeout(timeoutId);
      tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400 bg-gray-50/50">ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้</td></tr>`;
      if (moreRow) moreRow.classList.add("hidden");
      if (adminApprovalTbody) adminApprovalTbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400 bg-gray-50/50">ไม่สามารถโหลดคำขออนุมัติได้</td></tr>`;
    })
    .getUserLoanHistory(activeEmail, activeRole, 1, PAGE_SIZE, false);
}

  function switchTab(tabId, event = null) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  const currentTab = document.getElementById('tab-content-' + tabId);
  if(currentTab) currentTab.classList.remove('hidden');
  document.querySelectorAll('.sidebar-btn, .user-sidebar-btn').forEach(btn => {
    btn.classList.remove('bg-amber-500', 'text-slate-950', 'active');
    btn.classList.add('bg-transparent', 'text-slate-400');
  });
  
  if(event?.currentTarget) {
    event.currentTarget.classList.remove('bg-transparent', 'text-slate-400');
    event.currentTarget.classList.add('bg-amber-500', 'text-slate-950', 'active');
  } else {
    const fallbackBtn = document.querySelector(`button[onclick*="'${tabId}'"]`);
    if(fallbackBtn) {
       fallbackBtn.classList.remove('bg-transparent', 'text-slate-400');
       fallbackBtn.classList.add('bg-amber-500', 'text-slate-950', 'active');
    }
  }
  if(window.innerWidth < 1024) {
    const sidebar = document.getElementById("sidebar-menu");
    const overlay = document.getElementById("sidebar-overlay");
    if(sidebar) sidebar.classList.add("-translate-x-full");
    if(overlay) overlay.classList.add("hidden");
  }
  // keep mobile-top-tabs active state in sync with current tab
  try {
    const mobileTabs = document.getElementById('mobile-top-tabs');
    if (mobileTabs) {
      mobileTabs.querySelectorAll('button').forEach(btn => {
        btn.classList.remove('bg-amber-500','text-slate-900');
        btn.classList.add('bg-slate-100','text-slate-700');
        const dataTab = btn.getAttribute('data-tab');
        if (dataTab && dataTab === tabId) {
          btn.classList.remove('bg-slate-100','text-slate-700');
          btn.classList.add('bg-amber-500','text-slate-900');
        }
      });
    }
  } catch(e){/* ignore */}
}

  function validateCartBorrowDays() {
    const bDateInput = document.getElementById("cartBorrowDate");
    const dDateInput = document.getElementById("cartDueDate");
    const warning = document.getElementById("cart-date-warning");
    if(bDateInput) bDateInput.classList.remove("border-rose-500", "bg-rose-50");
    if(dDateInput) dDateInput.classList.remove("border-rose-500", "bg-rose-50");
    if(!bDateInput || !dDateInput || !bDateInput.value || !dDateInput.value) return true;
    const bDate = new Date(bDateInput.value);
    const dDate = new Date(dDateInput.value);
    if (dDate < bDate) {
      if(warning) {
        warning.innerText = "❌ วันกำหนดส่งคืน ห้ามอยู่ก่อน วันที่ขอยืมพัสดุ";
        warning.classList.remove("hidden");
      }
      dDateInput.classList.add("border-rose-500", "bg-rose-50");
      return false;
    }
    const diffTime = Math.abs(dDate - bDate);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    if (diffDays > 30) {
      if(warning) {
        warning.innerText = `❌ วันกำหนดส่งคืนห่างกันเกินไป (${diffDays} วัน) ระบบล็อกสิทธิ์ห้ามขอยืมเกิน 30 วัน!`;
        warning.classList.remove("hidden");
      }
      dDateInput.classList.add("border-rose-500", "bg-rose-50");
      return false;
    } else {
      if(warning) warning.classList.add("hidden");
      return true;
    }
  }

    if (!bDateInput || bDateInput.value === "") {

      if(bDateInput) {
        bDateInput.classList.add("border-rose-500", "bg-rose-50");

      }
      return;
    }
    if (!dDateInput || dDateInput.value === "") {
      showToast("❌ กรุณาระบุ วันกำหนดส่งคืนคลัง ให้ครบถ้วน", "error");

    }
    const purpose = purposeEl.value.trim();
    const bDateStr = bDateInput.value;
    const dDateStr = dDateInput.value;
    const submitBtn = document.getElementById("cartSubmitBtn");
    const borrowerName = MY_PROFILE_CACHE ? MY_PROFILE_CACHE.fullName : "User";

      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังส่งคำขอตัดสต็อกชีต...";

function submitUserForm(event) {
  event.preventDefault();
  const mode =
    document.getElementById("userMode").value;
  const username =
    document.getElementById("modalUsername").value.trim();
  const password =
    document.getElementById("modalPassword").value.trim();
  const role =
    document.getElementById("modalRole").value;
  if(username === "") {
    showToast("กรุณากรอก Username", "error");
    return;
  }
  if(mode === "ADD" && password === "") {
    showToast("กรุณากรอก Password", "error");
    return;
  }
  const submitBtn =
    document.querySelector("#userModalForm button[type='submit']");
  if(submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerText = "กำลังบันทึก...";
  }
  google.script.run
    .withSuccessHandler(function(res) {
      if(submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = "บันทึกข้อมูล";
      }
      if(res.success) {
        showToast(res.message, "success");
        closeModal("user-modal");
        loadDashboard();
      } else {
        showToast(res.message, "error");
      }
    })

        submitBtn.innerText = "บันทึกข้อมูล";
      }
      showToast("เกิดข้อผิดพลาด : " + err.message, "error");
    })

}

function closeProfileModal() {
  if (!IS_PROFILE_COMPLETE) {
    showToast("⚠️ กรุณากรอกข้อมูลโปรไฟล์ให้ครบถ้วนเพื่อเริ่มใช้งานระบบ", "error");
  } else {
    document.getElementById('profile-modal').classList.add('hidden');
  }
}

function openMyProfileModal() {
  const modal = $id("profile-modal");
  if(modal) modal.classList.remove("hidden");
  if (MY_PROFILE_CACHE) {
    document.getElementById("profFullName").value = MY_PROFILE_CACHE.fullName || "";
    document.getElementById("profEmail").value = MY_PROFILE_CACHE.email || "";
    document.getElementById("profPhone").value = MY_PROFILE_CACHE.phone || "";
    document.getElementById("profPosition").value = MY_PROFILE_CACHE.position || "";
    document.getElementById("profIdCode").value = MY_PROFILE_CACHE.idCode || "";
    document.getElementById("profMajor").value = MY_PROFILE_CACHE.major || "";
    document.getElementById("profLineId").value = MY_PROFILE_CACHE.lineId || "";
  }
  const cancelBtn = document.getElementById("profCancelBtn");
  if(!IS_PROFILE_COMPLETE) {
     if(cancelBtn) cancelBtn.classList.add("hidden"); 
  } else {
     if(cancelBtn) cancelBtn.classList.remove("hidden");
  }
}

// เรียกขยาย — โหลดทุกรายการ (ใช้ EXPAND_PAGE_SIZE เสมอ) แล้วเปลี่ยนปุ่มเป็น "ย่อรายการ"
function loadMoreUserHistory() {
  toggleLoadMore();
}

function toggleLoadMore() {
  const moreBtn = document.getElementById("load-more-history-btn");
  const fbBtn = document.getElementById("load-more-history-btn-fallback");
  const PAGE_SIZE = 5;
  const activeEmail = (typeof CURRENT_USER_EMAIL !== "undefined" ? CURRENT_USER_EMAIL : (window && window.CURRENT_USER_EMAIL)) || "";
  const activeRole = (typeof CURRENT_USER_ROLE !== "undefined" ? CURRENT_USER_ROLE : (window && window.CURRENT_USER_ROLE)) || "USER";
  const tbody = document.getElementById("user-history-tbody");
  const adminApprovalTbody = document.getElementById("admin-approval-tbody");
  if (!tbody || !activeEmail) return;

  if (!window.USER_HISTORY_EXPANDED) {
    // expand -> request full with EXPAND_PAGE_SIZE
    if (moreBtn) { moreBtn.disabled = true; moreBtn.dataset.origText = moreBtn.innerHTML || ""; moreBtn.innerText = "กำลังโหลด..."; }
    if (fbBtn) { fbBtn.disabled = true; fbBtn.dataset.origText = fbBtn.innerHTML || ""; fbBtn.innerText = "กำลังโหลด..."; }

    google.script.run
      .withSuccessHandler(function(resAll) {
        if (moreBtn) { moreBtn.disabled = false; }
        if (fbBtn) { fbBtn.disabled = false; }
        if (!resAll || !resAll.success || !Array.isArray(resAll.history)) {
          showToast("ไม่สามารถโหลดข้อมูลทั้งหมดได้", "error");
          return;
        }

        _renderHistoryRows(tbody, adminApprovalTbody, resAll.history, activeRole);
        window.USER_HISTORY_EXPANDED = true;

        const newLabel = "▲ ย่อรายการ";
        if (moreBtn) { moreBtn.innerText = newLabel; moreBtn.onclick = function() { loadUserHistoryData(); }; }
        if (fbBtn) { fbBtn.innerText = newLabel; fbBtn.onclick = function() { loadUserHistoryData(); }; }
      })
      .withFailureHandler(function(err) {
        if (moreBtn) { moreBtn.disabled = false; if (moreBtn.dataset.origText) moreBtn.innerHTML = moreBtn.dataset.origText; }
        if (fbBtn) { fbBtn.disabled = false; if (fbBtn.dataset.origText) fbBtn.innerHTML = fbBtn.dataset.origText; }
        showToast("ไม่สามารถโหลดข้อมูลทั้งหมดได้ (เกิดข้อผิดพลาด)", "error");
      })
      .getUserLoanHistory(activeEmail, activeRole, 1, EXPAND_PAGE_SIZE, true);
  } else {
    // collapse -> โหลด 5 รายการล่าสุด อีกครั้ง
    window.USER_HISTORY_EXPANDED = false;
    loadUserHistoryData();
  }
}

</script>
